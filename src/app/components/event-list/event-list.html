
<section class="events-page">
  <div class="events-header">
    <h1>Événements</h1>

    <a routerLink="/events/add" class="add-event-button">
      + Ajouter un événement
    </a>
  </div>

  <div class="category-filter">
    <label for="category">Filtrer par catégorie :</label>

    <select
      id="category"
      [value]="selectedCategory()"
      (change)="changeCategory($any($event.target).value)"
    >
      @for (category of categories(); track category) {
        <option [value]="category">
          {{ category }}
        </option>
      }
    </select>
  </div>

  <p class="events-count">
    {{ filteredEvents().length }} événement(s) trouvé(s)
  </p>

  <div class="events-grid">
    @for (event of paginatedEvents(); track event.id) {
      <app-event-card
        [event]="event"
        [isFavorite]="isFavorite(event.id)"
        (favoriteToggled)="toggleFavorite($event)"
        (deleteRequested)="onDeleteEvent($event)"
      />
    } @empty {
      <p class="empty-events">
        Aucun événement trouvé.
      </p>
    }
  </div>

  @if (totalPages() > 1) {
    <nav class="pagination" aria-label="Pagination des événements">
      <button
        type="button"
        class="page-button"
        [disabled]="currentPage() === 1"
        (click)="goToPage(currentPage() - 1)"
      >
        ← Précédent
      </button>

      @for (page of pageNumbers(); track page) {
        <button
          type="button"
          class="page-button"
          [class.active]="currentPage() === page"
          [attr.aria-current]="currentPage() === page ? 'page' : null"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }

      <button
        type="button"
        class="page-button"
        [disabled]="currentPage() === totalPages()"
        (click)="goToPage(currentPage() + 1)"
      >
        Suivant →
      </button>
    </nav>
  }
</section>
