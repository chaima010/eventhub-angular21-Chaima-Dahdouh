
<article class="card" [class.active]="isFavorite()">
  <img
    [src]="event().imageUrl"
    [alt]="event().title"
  >

  <div class="card-content">
    <span class="badge">
      {{ event().category | uppercase }}
    </span>

    <h3>{{ event().title }}</h3>

    <p class="event-info">
      📅 {{ event().date | date:'dd/MM/yyyy' }}
    </p>

    <p class="event-info">
      📍 {{ event().place }}
    </p>

    <p class="event-description">
      {{ event().description }}
    </p>

    <div class="card-footer">
      <strong>
        {{ event().price === 0
          ? 'Gratuit'
          : (event().price | currency:'TND':'symbol':'1.0-0')
        }}
      </strong>

      <a [routerLink]="['/events', event().id]">
        Voir les détails →
      </a>
    </div>

    <button
      type="button"
      class="favorite-button"
      [class.is-favorite]="isFavorite()"
      [attr.aria-pressed]="isFavorite()"
      (click)="onToggle()"
    >
      @if (isFavorite()) {
        ♥ Retirer des favoris
      } @else {
        ♡ Ajouter aux favoris
      }
    </button>
  </div>
</article>
